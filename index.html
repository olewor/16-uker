<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#EDEFE8; --card:#FFFFFF; --ink:#15211C; --muted:#6B7871; --line:#D2D8CE;
  --pine:#1F6B57; --pine-lys:#CDE0D8; --lime:#7FC04A;
  --viol:#5B3FD1; --viol-lys:#E4DEFB;
  --hav:#1687A7; --hav-lys:#D3EBF2;
  --rust:#C4451F; --rust-lys:#F8E2DA;
  --okse:#C08419; --okse-lys:#F7E9CB;
  --font-d:'Archivo', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-m:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-d);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--viol);outline-offset:2px;}

#skjerm{
  padding:22px 18px 118px;max-width:560px;margin:0 auto;width:100%;
  padding-left:max(18px, env(safe-area-inset-left));
  padding-right:max(18px, env(safe-area-inset-right));
}
body{overflow-x:hidden;}
a,a:visited{color:inherit;text-decoration:none;}

.eyebrow{font-family:var(--font-m);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;}
.topp{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.topp h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0;}
h2.seksjon{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;}
.uke-merke{font-family:var(--font-m);font-size:20px;font-weight:600;text-align:right;line-height:1.1;}
.uke-merke span{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-top:3px;}

.gauge{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px 16px 14px;}
.gauge-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.big{font-family:var(--font-m);font-size:52px;font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;}
.big-over{color:var(--rust);}
.gauge-side{min-width:118px;padding-top:4px;}
.side-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:2.5px 0;}
.side-row b{font-family:var(--font-m);color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500;}
.side-sum{border-top:1px solid var(--line);margin-top:4px;padding-top:5px;}
.track{position:relative;height:12px;background:var(--paper);border:1px solid var(--line);margin-top:18px;overflow:hidden;}
.track-main{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--pine),var(--lime));transition:width .35s;}
.track-over{position:absolute;top:0;bottom:0;background:var(--rust);transition:width .35s;}
.track-line{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);}
.track-labels{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--font-m);font-size:10px;color:var(--muted);}

.pbar-wrap{background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 3px 3px;padding:12px 16px 14px;}
.pbar-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
.pbar-num{font-family:var(--font-m);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.pbar-num b{color:var(--ink);font-weight:600;font-size:15px;}
.pbar{height:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden;}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--okse),#E0A63E);transition:width .35s;}

.okt-kort{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 16px;margin-top:14px;}
.okt-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px;}
.okt-teller{font-family:var(--font-m);font-size:12px;font-weight:600;white-space:nowrap;}
.okt-rad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
.okt-brikke{background:var(--paper);border:1px solid var(--line);border-left-width:3px;padding:9px 6px;text-align:left;border-radius:2px;}
.okt-brikke.type-kondis{border-left-color:var(--viol);background:var(--viol-lys);}
.okt-brikke.type-styrke{border-left-color:var(--okse);background:var(--okse-lys);}
.okt-brikke.type-test{border-left-color:var(--hav);background:var(--hav-lys);}
.okt-brikke.okt-gjort{background:var(--pine);border-color:var(--pine);}
.okt-gjort .okt-nr,.okt-gjort .okt-t{color:#fff;}
.okt-nr{display:block;font-family:var(--font-m);font-size:9.5px;color:var(--muted);}
.okt-t{display:block;font-size:11.5px;font-weight:600;margin-top:3px;line-height:1.25;}
.aq-linje{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11.5px;color:var(--muted);}
.aq-linje b{font-family:var(--font-m);color:var(--ink);font-size:12px;white-space:nowrap;}
.aq-track{flex:1;height:5px;background:var(--paper);border:1px solid var(--line);}
.aq-fill{height:100%;background:linear-gradient(90deg,var(--hav),var(--lime));transition:width .35s;}

ul.liste{list-style:none;margin:0;padding:0;}
.post{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-bottom:none;padding:11px 14px;}
.post:last-child{border-bottom:1px solid var(--line);}
.post-venstre{display:flex;gap:11px;align-items:center;min-width:0;}
.pil{font-family:var(--font-m);font-size:13px;width:19px;height:19px;display:grid;place-items:center;border-radius:50%;flex-shrink:0;}
.pil-opp{background:var(--pine-lys);color:var(--pine);}
.pil-ned{background:var(--viol-lys);color:var(--viol);}
.post-navn{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.post-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.post-hoyre{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.post-hoyre b{font-family:var(--font-m);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.x{background:none;border:none;color:var(--muted);font-size:12px;padding:4px;}

.tom-boks{background:var(--card);border:1px dashed var(--line);border-radius:3px;padding:20px 16px;text-align:center;font-size:13px;color:var(--muted);line-height:1.5;}

.sok-boks{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 16px 15px;}
.sok-rad{display:flex;gap:7px;margin-top:7px;}
.input{width:100%;padding:11px 12px;font-size:15px;font-family:inherit;background:var(--paper);border:1px solid var(--line);border-radius:2px;color:var(--ink);}
.input::placeholder{color:var(--muted);}
.input-mini{width:56px;text-align:center;font-family:var(--font-m);padding:11px 4px;}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45;}
.knapp{padding:11px 16px;font-size:14px;font-weight:600;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:2px;white-space:nowrap;}
.knapp-primar{background:var(--pine);border-color:var(--pine);color:#fff;}
.knapp-blokk{width:100%;}
.knapp-fare{width:100%;border-color:var(--rust);color:var(--rust);}
.feil{background:var(--rust-lys);border:1px solid #E8C4B6;border-radius:3px;padding:13px 15px;font-size:13px;line-height:1.5;margin-top:12px;color:#7C2C17;}

.treff{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pine);border-radius:2px;padding:12px 14px;margin-top:9px;}
.treff-navn{font-size:14.5px;font-weight:600;}
.treff-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.treff-tall{display:flex;gap:14px;margin-top:6px;font-size:11.5px;color:var(--muted);font-family:var(--font-m);}
.treff-tall b{color:var(--ink);font-size:13px;font-weight:600;}
.treff-add{display:flex;gap:6px;align-items:center;flex-shrink:0;}

.hurtig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
.hurtig-knapp{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:11px 12px;text-align:left;}
.hurtig-navn{display:block;font-size:13px;font-weight:600;line-height:1.25;color:var(--ink);}
.hurtig-tall{display:block;font-family:var(--font-m);font-size:10.5px;color:var(--muted);margin-top:4px;}
.okt-t,.treff-navn,.maskin-ovelse,.dag-tekst b{overflow-wrap:anywhere;}

.kort{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:15px 16px;display:flex;flex-direction:column;gap:10px;}
.to{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:end;}
.tre{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.felt{display:flex;flex-direction:column;gap:5px;}
.felt label{font-family:var(--font-m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.valg{display:flex;gap:6px;}
.valg-knapp{flex:1;padding:10px 4px;font-size:12.5px;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:2px;color:var(--muted);}
.valg-aktiv{background:var(--ink);border-color:var(--ink);color:#fff;}
.bryter{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--muted);cursor:pointer;}
.bryter input{margin-top:2px;accent-color:var(--pine);width:17px;height:17px;flex-shrink:0;}
.regne{border:1px solid var(--line);border-radius:2px;padding:11px 13px;background:var(--paper);}
.regne-rad{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:3px 0;}
.regne-rad b{font-family:var(--font-m);color:var(--ink);font-weight:500;}
.regne-sum{border-top:1px solid var(--line);margin-top:5px;padding-top:7px;}
.regne-sum b{font-size:16px;font-weight:600;color:var(--pine);}

.bars{display:flex;gap:5px;align-items:flex-end;margin-top:12px;}
.bar-col{flex:1;text-align:center;}
.bar-slot{position:relative;height:118px;display:flex;align-items:flex-end;background:var(--paper);border-bottom:1px solid var(--line);}
.bar{width:100%;background:linear-gradient(180deg,var(--lime),var(--pine));transition:height .4s;}
.bar-over{background:var(--rust);}
.bar-tom{background:var(--line);}
.bar-goal{position:absolute;left:-2px;right:-2px;height:1px;background:var(--ink);opacity:.45;}
.bar-lbl{font-family:var(--font-m);font-size:9.5px;text-transform:uppercase;color:var(--muted);margin-top:6px;}
.bar-val{font-family:var(--font-m);font-size:10.5px;margin-top:1px;}
.stat-rad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:13px 15px;}
.stat-num{font-family:var(--font-m);font-size:27px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.gronn{color:var(--pine);} .rod{color:var(--rust);}
.notat{background:var(--viol-lys);border-left:3px solid var(--viol);padding:12px 14px;font-size:12.5px;line-height:1.55;margin-top:12px;}

.graf-head{display:flex;justify-content:space-between;align-items:flex-start;}
.graf-num{font-family:var(--font-m);font-size:26px;font-weight:600;margin-top:3px;}
.delta{font-family:var(--font-m);font-size:14px;font-weight:600;padding:4px 9px;border-radius:2px;}
.delta-ned{background:var(--pine-lys);color:var(--pine);}
.delta-opp{background:var(--rust-lys);color:var(--rust);}
.graf{width:100%;height:auto;margin-top:12px;overflow:visible;}
.graf-linje{fill:none;stroke:var(--hav);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
.graf-prikk{fill:var(--card);stroke:var(--hav);stroke-width:1.6;}
.graf-maal{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.4;}
.graf-fot{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:10px;color:var(--muted);margin-top:6px;}

.ukeliste{margin-top:14px;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
.ukerad{border-bottom:1px solid var(--line);background:var(--card);}
.ukerad:last-child{border-bottom:none;}
.ukerad-naa{background:var(--viol-lys);box-shadow:inset 3px 0 0 var(--viol);}
.ukerad-hull{background:var(--rust-lys);box-shadow:inset 3px 0 0 var(--rust);}
.ukerad-topp{display:flex;align-items:center;gap:9px;width:100%;padding:12px 13px;background:none;border:none;text-align:left;}
.ukerad-nr{font-family:var(--font-m);font-size:11px;text-transform:uppercase;color:var(--muted);flex-shrink:0;}
.ukerad-tittel{flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ukerad-status{font-family:var(--font-m);font-size:11.5px;color:var(--muted);flex-shrink:0;}
.ukerad-status.ferdig{color:var(--pine);font-weight:600;background:var(--pine-lys);padding:2px 7px;border-radius:10px;}
.karet{font-size:17px;color:var(--muted);transform:rotate(90deg);flex-shrink:0;line-height:1;}
.karet-opp{transform:rotate(-90deg);}
.ukerad-innhold{padding:0 13px 13px;display:flex;flex-direction:column;gap:13px;}
.dag{border-top:1px solid var(--line);padding-top:11px;padding-left:9px;border-left:3px solid var(--line);}
.dag.type-kondis{border-left-color:var(--viol);}
.dag.type-styrke{border-left-color:var(--okse);}
.dag.type-test{border-left-color:var(--hav);}
.dag-topp{display:flex;gap:10px;align-items:flex-start;width:100%;background:none;border:none;text-align:left;padding:0;}
.hake{width:21px;height:21px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:12px;color:transparent;flex-shrink:0;background:var(--card);}
.dag-gjort .hake{background:var(--pine);border-color:var(--pine);color:#fff;}
.dag-tekst{flex:1;}
.dag-tekst b{display:block;font-size:13.5px;line-height:1.3;}
.dag-tall{display:block;font-family:var(--font-m);font-size:11px;color:var(--muted);margin-top:4px;}
.merke{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:2px;margin-right:7px;font-weight:600;font-family:var(--font-d);}
.type-kondis .merke{background:var(--viol-lys);color:var(--viol);}
.type-styrke .merke{background:var(--okse-lys);color:var(--okse);}
.type-test .merke{background:var(--hav-lys);color:var(--hav);}
.deler{margin:9px 0 0 31px;padding:0 0 0 15px;font-size:12.5px;line-height:1.6;color:var(--muted);}
.ovelser{margin:10px 0 0 31px;display:flex;flex-direction:column;gap:5px;}
.ovelse{font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;}
.maskin{color:var(--pine);font-size:12px;}
.maskinrad{border-bottom:1px solid var(--line);padding-bottom:9px;}
.maskinrad:last-of-type{border-bottom:none;padding-bottom:0;}
.maskin-ovelse{font-size:13.5px;font-weight:600;}
.maskin-navn{font-size:12.5px;color:var(--pine);margin-top:2px;}
.maskin-alt{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45;}
.fotnote{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);}

nav.tabs{
  position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  max-width:560px;margin:0 auto;
}
.tab{flex:1 1 0;min-width:0;padding:13px 1px 14px;background:none;border:none;font-size:10.5px;font-weight:600;color:var(--muted);border-top:2px solid transparent;margin-top:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tab-aktiv{color:var(--viol);border-top-color:var(--viol);}
#toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 17px;border-radius:2px;font-size:12.5px;font-weight:600;z-index:50;white-space:nowrap;display:none;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

function beregnMaal(s,vekt){
 const w=Number(vekt)||Number(s.startWeight)||110;
 const bmr=10*w+6.25*Number(s.height)-5*Number(s.age)+(s.sex==="mann"?5:-161);
 const tdee=bmr*Number(s.activity);
 const kcal=Math.max(s.sex==="mann"?1800:1500,Math.round((tdee-Number(s.deficit))/10)*10);
 const protein=Math.round((1.6*Math.min(w,100))/5)*5;
 return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,protein};}

/* ---------------- State ---------------- */
let state=defaultState(), tab='idag', apen=-1, visMaskiner=false, treff=[], sokFeil='', laster=false;

try{const r=localStorage.getItem(KEY);
 if(r){const p=JSON.parse(r);const b=defaultState();
  state={...b,...p,settings:{...b.settings,...(p.settings||{})}};
  if(!p.seeded){state.sessions={...state.sessions,"u1-0":true,"u1-1":true,"u1-2":true};state.seeded=true;}}
}catch(e){}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast("Fikk ikke lagret");}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';
 clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',1800);}

/* ---------------- Matsøk ---------------- */
async function sokMat(q){
 const key=(state.settings.apiKey||'').trim();
 if(!key)throw new Error('nokkel');
 const res=await fetch('https://api.anthropic.com/v1/messages',{
  method:'POST',
  headers:{'Content-Type':'application/json','x-api-key':key,
   'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,
   system:'Du er en norsk næringsdatabase. Du kjenner norske matvarer, merkevarer (Tine, Gilde, Kiwi, Rema 1000, Coop, First Price, Q, Synnøve) og norske porsjonsstørrelser. Svar ALLTID med kun rå JSON – ingen forklaring, ingen markdown.',
   messages:[{role:'user',content:'Finn kalorier og protein for: "'+q+'".\n\nSvar med dette formatet:\n{"treff":[{"navn":"Kort navn","porsjon":"1 porsjon (150 g)","kcal":210,"protein":18.5}]}\n\nRegler:\n- 1 til 4 treff, mest sannsynlige først.\n- Hvis brukeren har oppgitt mengde, regn ut for akkurat den mengden og gi ett treff.\n- Hvis ikke, bruk vanlig norsk porsjonsstørrelse og skriv gram i "porsjon".\n- kcal og protein gjelder porsjonen som er beskrevet.\n- Kun tall i kcal og protein, ingen enheter.'}]})});
 if(res.status===401)throw new Error('auth');
 if(!res.ok)throw new Error('nett');
 const data=await res.json();
 const tekst=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
 const c=tekst.replace(/```json/g,'').replace(/```/g,'').trim();
 const a=c.indexOf('{'),b=c.lastIndexOf('}');
 if(a===-1||b===-1)throw new Error('format');
 const p=JSON.parse(c.slice(a,b+1));
 if(!p.treff||!p.treff.length)throw new Error('tomt');
 return p.treff;}

async function gjorSok(){
 const q=document.getElementById('sok').value.trim();
 if(!q)return;
 laster=true;sokFeil='';treff=[];render();
 try{treff=await sokMat(q);}
 catch(err){
  treff=[];
  sokFeil=err.message==='nokkel'?'Legg inn API-nøkkelen din under Oppsett for å bruke søket. Uten nøkkel kan du fortsatt føre måltider manuelt.':
   err.message==='auth'?'Nøkkelen ble avvist. Sjekk at den er riktig under Oppsett.':
   err.message==='nett'?'Fikk ikke kontakt. Sjekk nettet og prøv igjen.':
   'Fant ingen tall for dette. Prøv et mer presist navn, f.eks. «200 g kyllingfilet», eller legg det inn manuelt.';}
 laster=false;render();
 if(q)setTimeout(()=>{const el=document.getElementById('sok');if(el)el.value=q;},0);}

/* ---------------- Handlinger ---------------- */
function leggTil(e){state.entries.push({id:uid(),date:todayKey(),ts:Date.now(),...e});save();render();}
function slett(id){state.entries=state.entries.filter(e=>e.id!==id);save();render();}
function toggleOkt(n){state.sessions[n]=!state.sessions[n];save();render();}
function settS(k,v){state.settings[k]=v;save();render();}
function byttTab(t){tab=t;treff=[];sokFeil='';render();window.scrollTo(0,0);}
function toggleUke(u){apen=(apen===u?0:u);render();}

function leggTreff(i){
 const t=treff[i];const el=document.getElementById('p'+i);
 const m=Number(el&&el.value)||1;
 leggTil({type:'mat',name:m===1?t.navn:t.navn+' ×'+m,kcal:round(t.kcal*m,0),protein:round(t.protein*m,1)});
 toast('Lagt til');}

function leggManuelt(){
 const n=document.getElementById('mNavn').value.trim();
 const k=document.getElementById('mKcal').value;
 const p=document.getElementById('mProt').value;
 if(!n||!k)return toast('Fyll inn navn og kcal');
 leggTil({type:'mat',name:n,kcal:Number(k),protein:Number(p)||0});toast('Lagt til');}

function leggOkt(){
 const n=document.getElementById('oNavn').value.trim();
 if(!n)return toast('Gi økten et navn');
 leggTil({type:'okt',name:n,minutes:Number(document.getElementById('oMin').value)||0,
  kcal:Number(document.getElementById('oKcal').value)||0,aq:Number(document.getElementById('oAq').value)||0});
 toast('Økt lagret');}

function leggVekt(){
 const v=Number(document.getElementById('vInn').value);
 if(!v)return toast('Skriv inn vekt');
 state.weights=state.weights.filter(w=>w.date!==todayKey());
 state.weights.push({date:todayKey(),kg:v});
 state.weights.sort((a,b)=>a.date.localeCompare(b.date));
 save();render();toast('Vekt lagret');}

function eksporter(){
 const blob=new Blob([JSON.stringify(state)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='vekt-backup-'+todayKey()+'.json';
 a.click();toast('Backup lastet ned');}

function importer(ev){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const p=JSON.parse(r.result);
  if(p.entries&&p.settings){state={...defaultState(),...p};save();render();toast('Gjenopprettet');}
  else toast('Ugyldig fil');}catch(e){toast('Ugyldig fil');}};
 r.readAsText(f);}

function slettAlt(){
 if(!confirm('Slette all logg? Dette kan ikke angres.'))return;
 if(!confirm('Helt sikker?'))return;
 state=defaultState();save();render();toast('Alt slettet');}

/* ---------------- Visninger ---------------- */
function gauge(spist,forbrent,maal){
 const netto=spist-forbrent,pct=Math.max(0,Math.min(1,netto/maal)),over=netto>maal;
 const overPct=over?Math.min(1,(netto-maal)/(maal*.35)):0,rest=maal-netto;
 return `<div class="gauge"><div class="gauge-top"><div>
  <div class="eyebrow">${over?'Over budsjett':'Igjen i dag'}</div>
  <div class="big ${over?'big-over':''}">${over?'+':''}${Math.abs(Math.round(rest))}</div></div>
  <div class="gauge-side">
   <div class="side-row"><span>Spist</span><b>${Math.round(spist)}</b></div>
   <div class="side-row"><span>Trening</span><b>−${Math.round(forbrent)}</b></div>
   <div class="side-row side-sum"><span>Netto</span><b>${Math.round(netto)}</b></div></div></div>
  <div class="track"><div class="track-main" style="width:${pct*74}%"></div>
  ${over?`<div class="track-over" style="left:74%;width:${overPct*26}%"></div>`:''}
  <div class="track-line" style="left:74%"></div></div>
  <div class="track-labels"><span>0</span><span>${maal} kcal</span></div></div>`;}

 <h2 class="seksjon">Ført i dag</h2>

function visUke(){
 const dag=todayKey(),s=state.settings;
 const sisteVekt=state.weights.length?state.weights[state.weights.length-1].kg:s.startWeight;
 const auto=beregnMaal(s,sisteVekt);
 const kMaal=s.autoTarget?auto.kcal:Number(s.kcalTarget);
 const dager=[];
 for(let i=6;i>=0;i--){const k=addDays(dag,-i);const p=state.entries.filter(e=>e.date===k);
  const inn=p.filter(e=>e.type==='mat').reduce((a,b)=>a+(b.kcal||0),0);
  const ut=p.filter(e=>e.type==='okt').reduce((a,b)=>a+(b.kcal||0),0);
  dager.push({l:DAGER[new Date(k+"T12:00:00").getDay()],v:Math.max(0,inn-ut),inn});}
 const forte=dager.filter(d=>d.inn>0);
 const snitt=forte.length?forte.reduce((a,b)=>a+b.v,0)/forte.length:0;
 const maks=Math.max(kMaal*1.25,...dager.map(d=>d.v),1);

 let graf='<div class="tom-boks">Logg vekt minst to ganger, så tegnes kurven her.</div>';
 if(state.weights.length>=2){
  const P=6,W=300,H=110,pts=state.weights;
  const hi=Math.max(...pts.map(p=>p.kg),s.startWeight)+1, lo=Math.min(...pts.map(p=>p.kg),s.goalWeight)-1;
  const x=i=>P+(i/(pts.length-1))*(W-P*2), y=v=>P+((hi-v)/(hi-lo))*(H-P*2);
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p.kg).toFixed(1)).join(' ');
  const siste=pts[pts.length-1].kg, endring=siste-pts[0].kg;
  graf=`<div class="graf-head"><div><div class="eyebrow">Vekt nå</div>
   <div class="graf-num">${round(siste,1)} kg</div></div>
   <div class="delta ${endring<=0?'delta-ned':'delta-opp'}">${endring>0?'+':''}${round(endring,1)} kg</div></div>
   <svg viewBox="0 0 ${W} ${H}" class="graf">
   <line x1="${P}" x2="${W-P}" y1="${y(s.goalWeight)}" y2="${y(s.goalWeight)}" class="graf-maal"/>
   <path d="${d}" class="graf-linje"/>
   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.kg)}" r="2.6" class="graf-prikk"/>`).join('')}</svg>
   <div class="graf-fot"><span>Start ${round(s.startWeight,1)} kg</span><span>Mål ${round(s.goalWeight,1)} kg</span></div>`;}

 return `<header class="topp"><div><div class="eyebrow">Siste 7 dager</div><h1>Uke</h1></div></header>
 <div class="kort"><div class="eyebrow">Netto kcal per dag</div>
  <div class="bars">${dager.map(d=>{const h=(d.v/maks)*100,over=d.v>kMaal;
   return `<div class="bar-col"><div class="bar-slot">
    <div class="bar ${over?'bar-over':''} ${d.v===0?'bar-tom':''}" style="height:${Math.max(d.v===0?2:4,h)}%"></div>
    <div class="bar-goal" style="bottom:${kMaal/maks*100}%"></div></div>
    <div class="bar-lbl">${d.l}</div><div class="bar-val">${d.v?Math.round(d.v):'–'}</div></div>`;}).join('')}</div></div>
 <div class="stat-rad">
  <div class="stat"><div class="eyebrow">Snitt</div><div class="stat-num">${Math.round(snitt)}</div><div class="stat-sub">kcal / dag</div></div>
  <div class="stat"><div class="eyebrow">Mot mål</div>
   <div class="stat-num ${snitt<=kMaal?'gronn':'rod'}">${snitt<=kMaal?'−':'+'}${Math.abs(Math.round(kMaal-snitt))}</div>
   <div class="stat-sub">${forte.length} dager ført</div></div></div>
 ${forte.length>=3?`<div class="notat">Med dette snittet ligger du an til omtrent
   <b>${round((kMaal-snitt)*7/7700,1)} kg</b> vekttap i uka.</div>`:''}
 <h2 class="seksjon">Vektkurve</h2><div class="kort">${graf}</div>`;}

 const auto=beregnMaal(s,sisteVekt);
 return `<header class="topp"><div><div class="eyebrow">Innstillinger</div><h1>Oppsett</h1></div></header>

    onclick="settS('sex','${k}')">${k==='mann'?'Mann':'Kvinne'}</button>`).join('')}</div></div>
  <div class="to">
   <div class="felt"><label>Alder</label><input class="input" type="number" value="${s.age}" onchange="settS('age',Number(this.value))"></div>
   <div class="felt"><label>Høyde (cm)</label><input class="input" type="number" value="${s.height}" onchange="settS('height',Number(this.value))"></div></div>
  <div class="to">
   <div class="felt"><label>Startvekt (kg)</label><input class="input" type="number" step="0.1" value="${s.startWeight}" onchange="settS('startWeight',Number(this.value))"></div>
   <div class="felt"><label>Målvekt (kg)</label><input class="input" type="number" step="0.1" value="${s.goalWeight}" onchange="settS('goalWeight',Number(this.value))"></div></div>
  <div class="felt"><label>Aktivitetsnivå ellers</label><div class="valg">
   ${[[1.25,'Stillesittende'],[1.4,'Litt aktiv'],[1.55,'Aktiv']].map(([v,l])=>
    `<button class="valg-knapp ${Number(s.activity)===v?'valg-aktiv':''}" onclick="settS('activity',${v})">${l}</button>`).join('')}</div></div>
  <div class="hint">BMI ved ${round(sisteVekt,1)} kg: ${round(sisteVekt/Math.pow(s.height/100,2),1)}</div></div>

 <h2 class="seksjon">Mål</h2>
 <div class="kort">
  <div class="regne">
   <div class="regne-rad"><span>Hvilebehov (BMR)</span><b>${auto.bmr} kcal</b></div>
   <div class="regne-rad"><span>Totalforbruk</span><b>${auto.tdee} kcal</b></div>
   <div class="regne-rad regne-sum"><span>Anbefalt inntak</span><b>${auto.kcal} kcal</b></div></div>
  <div class="felt"><label>Underskudd per dag</label><div class="valg">
   ${[400,600,750].map(v=>`<button class="valg-knapp ${Number(s.deficit)===v?'valg-aktiv':''}"
    onclick="settS('deficit',${v})">${v}</button>`).join('')}</div></div>
  <label class="bryter"><input type="checkbox" ${s.autoTarget?'checked':''}
   onchange="settS('autoTarget',this.checked)">
   <span>Regn ut målet automatisk, og juster det etter hvert som vekten faller</span></label>
  ${!s.autoTarget?`<div class="to">
   <div class="felt"><label>Kcal-mål</label><input class="input" type="number" value="${s.kcalTarget}" onchange="settS('kcalTarget',Number(this.value))"></div>
   <div class="felt"><label>Protein-mål (g)</label><input class="input" type="number" value="${s.proteinTarget}" onchange="settS('proteinTarget',Number(this.value))"></div></div>`:''}
  <div class="felt"><label>AQ-mål per uke</label><input class="input" type="number" value="${s.aqGoal}" onchange="settS('aqGoal',Number(this.value))"></div></div>

 <h2 class="seksjon">Matsøk</h2>
 <div class="kort">
  <div class="felt"><label>Anthropic API-nøkkel</label>
   <input class="input" type="password" placeholder="sk-ant-..." value="${esc(s.apiKey||'')}"
    onchange="settS('apiKey',this.value.trim())"></div>
  <div class="hint">Nøkkelen lagres kun i denne nettleseren og sendes bare til Anthropic.
   Ikke skriv den inn i selve HTML-fila før du legger den på GitHub – da blir den offentlig.
   Uten nøkkel virker alt annet som normalt, du fører bare måltider manuelt.</div></div>

 <h2 class="seksjon">Data</h2>
 <div class="kort">
  <div class="hint">Alt ligger i denne nettleseren. Eksporter jevnlig – bytter du telefon
   eller tømmer nettleserdata, er loggen borte uten backup.</div>
  <button class="knapp knapp-blokk" onclick="eksporter()">Last ned backup</button>
  <label class="knapp knapp-blokk" style="display:block;text-align:center">Gjenopprett fra fil
   <input type="file" accept="application/json" onchange="importer(event)" style="display:none"></label>
  <button class="knapp knapp-fare" onclick="slettAlt()">Slett all data</button></div>

 <div class="fotnote">Kaloritall fra søket er anslag, ikke laboratoriemålinger.
  Bruk dem til å se retningen over tid.</div>`;}

/* ---------------- Render ---------------- */
const TABS=[['idag','I dag'],['legg','Legg til'],['uke','Uke'],['plan','Plan'],['opp','Oppsett']];

function render(){
 const v={idag:visIDag,legg:visLegg,uke:visUke,plan:visPlan,opp:visOppsett}[tab];
 document.getElementById('skjerm').innerHTML=v();
 document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>
  `<button class="tab ${tab===k?'tab-aktiv':''}" onclick="byttTab('${k}')">${l}</button>`).join('');}

render();
setInterval(()=>{if(tab==='idag')render();},60000);
</script>
</body>
</html>
